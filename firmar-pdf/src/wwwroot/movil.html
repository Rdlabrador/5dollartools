<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F4F2EE">
<title>PepePDF</title>
<style>
  :root { --bg: #F4F2EE; --text: #1F2430; --muted: #5B6170; --accent: #1D4ED8; --tinta: #1E3A8A; --peligro: #B42318; --borde: #C9CDD5; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none;
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text);
    -webkit-user-select: none; user-select: none; }
  body { display: flex; flex-direction: column; height: 100dvh; font-size: 18px; }
  h1 { margin: 0; padding: 16px 12px 10px; font-size: 28px; text-align: center; font-weight: 700; }
  #zona { flex: 1; min-height: 0; margin: 0 12px; position: relative; border: 3px dashed var(--borde); border-radius: 16px; background: #fff; box-shadow: 0 1px 3px rgba(31,36,48,.14), 0 8px 24px rgba(31,36,48,.10); }
  #lienzo { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  #linea { position: absolute; left: 6%; right: 6%; bottom: 28%; border-bottom: 2px solid #C9CDD5; pointer-events: none; }
  #linea::before { content: "×"; position: absolute; left: 0; bottom: 2px; font-size: 28px; color: #8A90A0; }
  #pista { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 22px; pointer-events: none; }
  .botones { display: flex; gap: 12px; padding: 14px 12px calc(14px + env(safe-area-inset-bottom)); }
  button { flex: 1; min-height: 64px; border-radius: 12px; border: 1.5px solid var(--borde); background: #fff; color: var(--text);
    font: inherit; font-size: 22px; font-weight: 600; cursor: pointer; touch-action: manipulation; box-shadow: 0 1px 3px rgba(31,36,48,.14);
    display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.primary { flex: 1.6; background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; box-shadow: none; }
  button svg { flex: none; display: block; }
  #fin { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 24px; font-size: 28px; font-weight: 700; }
  #fin small { font-size: 22px; font-weight: 400; color: var(--muted); }
  #fin.error { color: var(--peligro); }
  #fin.on { display: flex; }
  #fin button { flex: none; width: 100%; max-width: 360px; }
</style>
</head>
<body>
<h1 data-k="titulo"></h1>
<div id="zona">
  <canvas id="lienzo"></canvas>
  <div id="linea"></div>
  <div id="pista" data-k="pista"></div>
</div>
<div class="botones">
  <button id="borrar" type="button"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6M14 11v6"/></svg> <span data-k="borrar"></span></button>
  <button id="enviar" type="button" class="primary" disabled><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-11 11"/><path d="M22 2 15 22l-4-9-9-4z"/></svg> <span data-k="enviar"></span></button>
</div>
<div id="fin" role="status">
  <div id="finTexto"></div>
  <small id="finSub"></small>
  <button id="reintentar" type="button" style="display:none" data-k="reintentar"></button>
</div>

<script>
(function () {
  // Idioma: ?l=es|en (lo pone el programa en la dirección del código QR). Por defecto, español.
  var TX = {
    es: {
      titulo: 'Firme aquí con el dedo', pista: 'Dibuje su firma', borrar: 'Borrar', enviar: 'Enviar al computador',
      reintentar: 'Intentar de nuevo',
      listo: '¡Listo! Mire el computador.', listoSub: 'Ya puede cerrar esta página.',
      error: 'No se pudo enviar.', errorSub: 'Revise que el celular siga en la misma red Wi-Fi. Si el código venció, pida uno nuevo en el computador.'
    },
    en: {
      titulo: 'Sign here with your finger', pista: 'Draw your signature', borrar: 'Clear', enviar: 'Send to the computer',
      reintentar: 'Try again',
      listo: 'Done! Look at the computer.', listoSub: 'You can close this page now.',
      error: 'It could not be sent.', errorSub: 'Check that your phone is still on the same Wi-Fi network. If the code has expired, ask for a new one on the computer.'
    }
  };
  var m = /[?&]l=(es|en)\b/.exec(location.search);
  var L = m ? m[1] : 'es';
  var T = TX[L];
  document.documentElement.lang = L;
  Array.prototype.forEach.call(document.querySelectorAll('[data-k]'), function (el) { el.textContent = T[el.getAttribute('data-k')]; });
  var zona = document.getElementById('zona');
  var cv = document.getElementById('lienzo');
  var ctx = cv.getContext('2d');
  var pista = document.getElementById('pista');
  var bBorrar = document.getElementById('borrar');
  var bEnviar = document.getElementById('enviar');
  var fin = document.getElementById('fin');
  var trazos = [];      // cada trazo: arreglo de puntos {x,y} en píxeles CSS
  var actual = null;
  var ANCHO = 4;        // grosor del trazo en px CSS
  var COLOR = '#1E3A8A';  // azul tinta

  function ajustar() {
    var dpr = Math.max(1, window.devicePixelRatio || 1);
    var r = zona.getBoundingClientRect();
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
    redibujar();
  }

  function dibujar(c, escala, dx, dy) {
    c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = COLOR; c.fillStyle = COLOR;
    c.lineWidth = ANCHO * escala;
    trazos.forEach(function (t) {
      if (t.length === 1) {
        c.beginPath(); c.arc(t[0].x * escala + dx, t[0].y * escala + dy, ANCHO * escala / 2, 0, 6.2832); c.fill(); return;
      }
      c.beginPath();
      c.moveTo(t[0].x * escala + dx, t[0].y * escala + dy);
      // curva suave por puntos medios
      for (var i = 1; i < t.length - 1; i++) {
        var mx = (t[i].x + t[i + 1].x) / 2, my = (t[i].y + t[i + 1].y) / 2;
        c.quadraticCurveTo(t[i].x * escala + dx, t[i].y * escala + dy, mx * escala + dx, my * escala + dy);
      }
      var u = t[t.length - 1];
      c.lineTo(u.x * escala + dx, u.y * escala + dy);
      c.stroke();
    });
  }

  function redibujar() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    dibujar(ctx, Math.max(1, window.devicePixelRatio || 1), 0, 0);
    var hay = trazos.length > 0;
    pista.style.display = hay ? 'none' : 'grid';
    bEnviar.disabled = !hay;
  }

  function punto(e) {
    var r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (x) {}
    actual = [punto(e)];
    trazos.push(actual);
    redibujar();
  });
  cv.addEventListener('pointermove', function (e) {
    if (!actual) return;
    e.preventDefault();
    var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    if (!evs.length) evs = [e];
    evs.forEach(function (ev) { actual.push(punto(ev)); });
    redibujar();
  });
  function soltar(e) { if (actual) { e.preventDefault(); actual = null; } }
  cv.addEventListener('pointerup', soltar);
  cv.addEventListener('pointercancel', soltar);
  ['touchstart', 'touchmove', 'gesturestart'].forEach(function (n) {
    // bloquea scroll y zoom, pero deja pasar los toques a los botones (si no, "Enviar" no responde en el celular)
    document.addEventListener(n, function (e) {
      if (e.target && e.target.closest && e.target.closest('button')) return;
      e.preventDefault();
    }, { passive: false });
  });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  bBorrar.addEventListener('click', function () { trazos = []; actual = null; redibujar(); });

  // Genera el PNG transparente recortado al contenido, con margen
  function generarPng() {
    var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
    trazos.forEach(function (t) { t.forEach(function (p) {
      if (p.x < minX) minX = p.x; if (p.y < minY) minY = p.y;
      if (p.x > maxX) maxX = p.x; if (p.y > maxY) maxY = p.y;
    }); });
    var m = ANCHO * 2 + 6;
    minX -= m; minY -= m; maxX += m; maxY += m;
    var w = maxX - minX, h = maxY - minY;
    var esc = Math.max(2, window.devicePixelRatio || 1);
    var tope = 2000 / Math.max(w, h);
    if (esc > tope) esc = tope;
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * esc));
    c.height = Math.max(1, Math.round(h * esc));
    dibujar(c.getContext('2d'), esc, -minX * esc, -minY * esc);
    return c.toDataURL('image/png');
  }

  function mostrar(texto, sub, error) {
    document.getElementById('finTexto').textContent = texto;
    document.getElementById('finSub').textContent = sub || '';
    fin.className = (error ? 'error ' : '') + 'on';
    document.getElementById('reintentar').style.display = error ? 'block' : 'none';
  }

  bEnviar.addEventListener('click', function () {
    if (!trazos.length) return;
    bEnviar.disabled = true; bBorrar.disabled = true;
    var cuerpo = JSON.stringify({ png: generarPng() });
    fetch(location.pathname.replace(/\/$/, '') + '/firma', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: cuerpo
    }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (j) {
      if (!j.ok) throw new Error('no');
      mostrar(T.listo, T.listoSub, false);
    }).catch(function () {
      bBorrar.disabled = false; bEnviar.disabled = false;
      mostrar(T.error, T.errorSub, true);
    });
  });

  document.getElementById('reintentar').addEventListener('click', function () { fin.className = ''; });

  window.addEventListener('resize', ajustar);
  window.addEventListener('orientationchange', function () { setTimeout(ajustar, 200); });
  ajustar();
})();
</script>
</body>
</html>
