<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F4F2EE">
<title>PepePDF</title>
<style>
  :root { --bg: #F4F2EE; --text: #1F2430; --muted: #5B6170; --accent: #1D4ED8; --peligro: #B42318; --borde: #C9CDD5; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; overscroll-behavior: none;
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  body { font-size: 18px; padding: 0 12px calc(16px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
  h1 { margin: 0; padding: 18px 4px 6px; font-size: 28px; text-align: center; font-weight: 700; }
  p.ayuda { margin: 0 0 14px; text-align: center; color: var(--muted); font-size: 20px; }
  button { width: 100%; min-height: 68px; border-radius: 12px; border: 1.5px solid var(--borde); background: #fff; color: var(--text);
    font: inherit; font-size: 22px; font-weight: 600; cursor: pointer; touch-action: manipulation; box-shadow: 0 1px 3px rgba(31,36,48,.14);
    display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; box-shadow: none; }
  button svg { flex: none; display: block; }
  input[type=file] { display: none; }
  #cuenta { text-align: center; color: var(--muted); font-size: 20px; margin: 4px 0 10px; min-height: 28px; }
  #cuenta.aviso { color: var(--peligro); }
  #miniaturas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .mini { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #fff; border: 1.5px solid var(--borde); }
  .mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mini .quitar { position: absolute; top: 4px; right: 4px; width: 44px; min-height: 44px; height: 44px; margin: 0; padding: 0; border-radius: 50%;
    background: var(--peligro); border-color: #fff; color: #fff; font-size: 24px; line-height: 1; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .mini.trabajando::after { content: "…"; position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255,255,255,.8); font-size: 32px; }
  #barra { display: none; height: 14px; border-radius: 7px; background: #DDE0E6; overflow: hidden; margin: 0 0 12px; }
  #barra i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
  #fin { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 24px; font-size: 28px; font-weight: 700; }
  #fin small { font-size: 22px; font-weight: 400; color: var(--muted); }
  #fin.error { color: var(--peligro); }
  #fin.on { display: flex; }
  #fin button { width: 100%; max-width: 360px; }
</style>
</head>
<body>
<h1 data-k="titulo"></h1>
<p class="ayuda" data-k="ayuda"></p>
<button id="tomar" type="button" class="primary"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/></svg> <span data-k="tomar"></span></button>
<button id="galeria" type="button"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg> <span data-k="galeria"></span></button>
<input id="inCamara" type="file" accept="image/*" capture="environment">
<input id="inGaleria" type="file" accept="image/*" multiple>
<div id="cuenta" role="status"></div>
<div id="miniaturas"></div>
<div id="barra"><i id="barraRel"></i></div>
<button id="enviar" type="button" class="primary" disabled><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-11 11"/><path d="M22 2 15 22l-4-9-9-4z"/></svg> <span id="enviarTxt" data-k="enviar"></span></button>
<div id="fin" role="status">
  <div id="finTexto"></div>
  <small id="finSub"></small>
  <button id="reintentar" type="button" style="display:none" data-k="reintentar"></button>
</div>

<script>
(function () {
  // Idioma: ?l=es|en (lo pone el programa en la dirección del código QR). Por defecto, español.
  // Aquí NO se bloquea ningún toque a nivel de documento: así los botones responden en iPhone y Android.
  var TX = {
    es: {
      titulo: 'Enviar fotos al computador', ayuda: 'Puede juntar hasta 10 fotos.',
      tomar: 'Tomar foto', galeria: 'Elegir de la galería', enviar: 'Enviar', enviando: 'Enviando…',
      cuenta0: 'Aún no hay fotos.', cuenta1: '1 foto lista.', cuentaN: '{n} fotos listas.',
      tope: 'Solo caben 10 fotos. Se agregaron las primeras.', quitar: 'Quitar esta foto',
      malFoto: 'No se pudo leer una de las fotos.',
      reintentar: 'Intentar de nuevo',
      listo: 'Listo, ya puede mirar el computador.', listoSub: 'Ya puede cerrar esta página.',
      error: 'No se pudo enviar.', errorSub: 'Revise que el celular siga en la misma red Wi-Fi. Si el código venció, pida uno nuevo en el computador.'
    },
    en: {
      titulo: 'Send photos to the computer', ayuda: 'You can add up to 10 photos.',
      tomar: 'Take a photo', galeria: 'Choose from gallery', enviar: 'Send', enviando: 'Sending…',
      cuenta0: 'No photos yet.', cuenta1: '1 photo ready.', cuentaN: '{n} photos ready.',
      tope: 'Only 10 photos fit. The first ones were added.', quitar: 'Remove this photo',
      malFoto: 'One of the photos could not be read.',
      reintentar: 'Try again',
      listo: 'Done, you can look at the computer now.', listoSub: 'You can close this page now.',
      error: 'It could not be sent.', errorSub: 'Check that your phone is still on the same Wi-Fi network. If the code has expired, ask for a new one on the computer.'
    }
  };
  var m = /[?&]l=(es|en)\b/.exec(location.search);
  var L = m ? m[1] : 'es';
  var T = TX[L];
  var MAX = 10, LADO = 2000, CALIDAD = 0.85;
  document.documentElement.lang = L;
  Array.prototype.forEach.call(document.querySelectorAll('[data-k]'), function (el) { el.textContent = T[el.getAttribute('data-k')]; });

  var fotos = [];          // cada una: {url: dataURL JPEG ya reducido}
  var pendientes = 0;      // fotos que se están reduciendo
  var enviando = false;
  var cont = document.getElementById('miniaturas');
  var cuenta = document.getElementById('cuenta');
  var bEnviar = document.getElementById('enviar');
  var bTomar = document.getElementById('tomar');
  var bGaleria = document.getElementById('galeria');
  var inCamara = document.getElementById('inCamara');
  var inGaleria = document.getElementById('inGaleria');
  var barra = document.getElementById('barra');
  var barraRel = document.getElementById('barraRel');
  var fin = document.getElementById('fin');

  function textoCuenta(aviso) {
    var n = fotos.length;
    cuenta.textContent = aviso || (n === 0 ? T.cuenta0 : n === 1 ? T.cuenta1 : T.cuentaN.replace('{n}', n));
    cuenta.className = aviso ? 'aviso' : '';
  }
  function pintar() {
    cont.innerHTML = '';
    fotos.forEach(function (f, i) {
      var d = document.createElement('div'); d.className = 'mini';
      var im = document.createElement('img'); im.src = f.url; im.alt = '';
      var x = document.createElement('button'); x.type = 'button'; x.className = 'quitar'; x.textContent = '×';
      x.setAttribute('aria-label', T.quitar); x.title = T.quitar;
      x.addEventListener('click', function () { if (enviando) return; fotos.splice(i, 1); pintar(); textoCuenta(); });
      d.appendChild(im); d.appendChild(x); cont.appendChild(d);
    });
    for (var k = 0; k < pendientes; k++) { var p = document.createElement('div'); p.className = 'mini trabajando'; cont.appendChild(p); }
    bEnviar.disabled = enviando || !fotos.length || pendientes > 0;
    var lleno = fotos.length + pendientes >= MAX;
    bTomar.disabled = bGaleria.disabled = enviando || lleno;
  }

  // Abre la foto respetando la orientación EXIF y la reduce (lado mayor 2000 px) a JPEG calidad 0,85
  function abrirImagen(file) {
    if (window.createImageBitmap) {
      return createImageBitmap(file, { imageOrientation: 'from-image' }).catch(function () { return viaImg(file); });
    }
    return viaImg(file);
  }
  function viaImg(file) { // el navegador aplica la orientación EXIF al dibujar (image-orientation: from-image)
    return new Promise(function (ok, mal) {
      var u = URL.createObjectURL(file), im = new Image();
      im.onload = function () { URL.revokeObjectURL(u); ok(im); };
      im.onerror = function () { URL.revokeObjectURL(u); mal(new Error('img')); };
      im.src = u;
    });
  }
  function reducir(file) {
    return abrirImagen(file).then(function (src) {
      var w = src.naturalWidth || src.width, h = src.naturalHeight || src.height;
      if (!w || !h) throw new Error('vacia');
      var k = Math.min(1, LADO / Math.max(w, h));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
      var x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); // por si la foto trae transparencia
      x.drawImage(src, 0, 0, c.width, c.height);
      if (src.close) src.close();
      var url = c.toDataURL('image/jpeg', CALIDAD);
      c.width = c.height = 0;
      return url;
    });
  }

  function agregarArchivos(lista) {
    var archivos = Array.prototype.slice.call(lista || []);
    if (!archivos.length || enviando) return;
    var libre = MAX - fotos.length - pendientes, aviso = '';
    if (archivos.length > libre) { archivos = archivos.slice(0, Math.max(0, libre)); aviso = T.tope; }
    pendientes += archivos.length; pintar();
    var cadena = Promise.resolve();
    archivos.forEach(function (f) {
      cadena = cadena.then(function () {
        return reducir(f).then(function (url) { fotos.push({ url: url }); }, function () { aviso = T.malFoto; })
          .then(function () { pendientes--; pintar(); textoCuenta(aviso); });
      });
    });
    cadena.then(function () { textoCuenta(aviso); });
  }

  bTomar.addEventListener('click', function () { inCamara.click(); });
  bGaleria.addEventListener('click', function () { inGaleria.click(); });
  inCamara.addEventListener('change', function () { var l = inCamara.files; agregarArchivos(l); setTimeout(function () { inCamara.value = ''; }, 0); });
  inGaleria.addEventListener('change', function () { var l = inGaleria.files; agregarArchivos(l); setTimeout(function () { inGaleria.value = ''; }, 0); });

  function mostrar(texto, sub, error) {
    document.getElementById('finTexto').textContent = texto;
    document.getElementById('finSub').textContent = sub || '';
    fin.className = (error ? 'error ' : '') + 'on';
    document.getElementById('reintentar').style.display = error ? 'block' : 'none';
  }

  bEnviar.addEventListener('click', function () {
    if (enviando || !fotos.length || pendientes) return;
    enviando = true; pintar();
    document.getElementById('enviarTxt').textContent = T.enviando;
    barra.style.display = 'block'; barraRel.style.width = '0';
    var cuerpo = JSON.stringify({ fotos: fotos.map(function (f) { return f.url; }) });
    var xhr = new XMLHttpRequest();
    xhr.open('POST', location.pathname.replace(/\/$/, '') + '/fotos');
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.timeout = 120000;
    xhr.upload.onprogress = function (e) { if (e.lengthComputable) barraRel.style.width = Math.round(e.loaded / e.total * 100) + '%'; };
    function fallo() {
      enviando = false; barra.style.display = 'none';
      document.getElementById('enviarTxt').textContent = T.enviar; pintar();
      mostrar(T.error, T.errorSub, true);
    }
    xhr.onerror = fallo; xhr.ontimeout = fallo;
    xhr.onload = function () {
      var ok = false;
      try { ok = xhr.status === 200 && JSON.parse(xhr.responseText).ok === true; } catch (x) {}
      if (!ok) { fallo(); return; }
      barraRel.style.width = '100%';
      mostrar(T.listo, T.listoSub, false);
    };
    xhr.send(cuerpo);
  });

  document.getElementById('reintentar').addEventListener('click', function () { fin.className = ''; });
  textoCuenta(); pintar();
})();
</script>
</body>
</html>
