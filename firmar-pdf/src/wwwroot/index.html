<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PepePDF</title>
<link rel="stylesheet" href="lib/pdfjs/web/pdf_viewer.css">
<link rel="stylesheet" href="app.css">
</head>
<body data-estado="vacio">

<header id="barra">
  <button class="btn tb primary firmar" id="bFirmar" data-i18n-title="index.firmarTit"><span class="ic" data-ic="firmar"></span> <span data-i18n="index.firmar"></span></button>
  <button class="btn tb" id="bAbrir" data-i18n-title="index.abrirTit"><span class="ic" data-ic="abrir"></span> <span data-i18n="index.abrir"></span></button>
  <button class="btn tb solo-doc" id="bGuardar" data-i18n-title="index.guardarTit"><span class="ic" data-ic="guardar"></span> <span data-i18n="index.guardar"></span></button>
  <button class="btn tb solo-doc" id="bImprimir" data-i18n-title="index.imprimirTit"><span class="ic" data-ic="imprimir"></span> <span data-i18n="index.imprimir"></span></button>
  <span class="sep solo-doc"></span>
  <div class="menu-caja solo-doc" id="cajaRellenar">
    <button class="btn tb" id="bRellenar" data-i18n-title="index.rellenarTit" aria-haspopup="menu" aria-expanded="false"><span class="ic" data-ic="rellenar"></span> <span data-i18n="index.rellenar"></span> <span class="ic" data-ic="abajo" data-tam="20"></span></button>
    <div class="menu hidden" id="menuRellenar" role="menu">
      <button class="menu-item" id="bTexto" role="menuitem" data-i18n-title="index.textoTit"><span class="ic" data-ic="texto"></span> <span data-i18n="index.texto"></span></button>
      <button class="menu-item" id="bFecha" role="menuitem" data-i18n-title="index.fechaTit"><span class="ic" data-ic="fecha"></span> <span data-i18n="index.fecha"></span></button>
      <button class="menu-item" id="bFotoCelular" role="menuitem" data-i18n-title="index.fotoCelularTit"><span class="ic" data-ic="imagen"></span> <span data-i18n="index.fotoCelular"></span></button>
      <button class="menu-item" id="bAnotar" role="menuitem" data-i18n-title="index.anotarTit"><span class="ic" data-ic="anotar"></span> <span data-i18n="index.anotar"></span></button>
    </div>
  </div>
  <button class="btn tb solo-doc" id="bBuscar" data-i18n-title="index.buscarTit"><span class="ic" data-ic="buscar"></span> <span data-i18n="index.buscar"></span></button>
  <button class="btn tb solo-doc" id="bPaginas" data-i18n-title="index.paginasTit"><span class="ic" data-ic="paginas"></span> <span data-i18n="index.paginas"></span></button>
  <button class="btn tb" id="bHerramientas" data-i18n-title="index.herramientasTit"><span class="ic" data-ic="herramientas"></span> <span data-i18n="index.herramientas"></span></button>
  <span class="grow"></span>
  <button class="btn tb idioma" id="bIdioma" data-i18n-title="index.idiomaTit" data-i18n-aria="index.idiomaAria"><span class="ic" data-ic="globo" data-tam="22"></span> <span id="idiomaTxt">ES</span></button>
</header>

<!-- Barra de anotar (segunda fila) -->
<div id="barraAnotar" class="hidden">
  <button class="btn tb herr" data-herr="resaltar" data-i18n-title="index.resaltarTit"><span class="ic" data-ic="anotar"></span> <span data-i18n="index.resaltar"></span></button>
  <button class="btn tb herr" data-herr="subrayar" data-i18n-title="index.subrayarTit"><span class="ic" data-ic="subrayar"></span> <span data-i18n="index.subrayar"></span></button>
  <button class="btn tb herr" data-herr="tachar" data-i18n-title="index.tacharTit"><span class="ic" data-ic="tachar"></span> <span data-i18n="index.tachar"></span></button>
  <button class="btn tb herr" data-herr="dibujar" data-i18n-title="index.dibujarTit"><span class="ic" data-ic="dibujar"></span> <span data-i18n="index.dibujar"></span></button>
  <button class="btn tb herr" data-herr="rect" data-i18n-title="index.rectTit"><span class="ic" data-ic="rect"></span> <span data-i18n="index.rect"></span></button>
  <button class="btn tb herr" data-herr="flecha" data-i18n-title="index.flechaTit"><span class="ic" data-ic="flecha"></span> <span data-i18n="index.flecha"></span></button>
  <button class="btn tb herr" data-herr="nota" data-i18n-title="index.notaTit"><span class="ic" data-ic="nota"></span> <span data-i18n="index.nota"></span></button>
  <span class="sep"></span>
  <span class="etq" data-i18n="index.color"></span>
  <span id="coloresAnotar">
    <button class="col" data-color="amarillo" data-i18n-title="index.amarillo" data-i18n-aria="index.amarillo" style="background:#ffe600"></button>
    <button class="col" data-color="verde" data-i18n-title="index.verde" data-i18n-aria="index.verde" style="background:#35d05a"></button>
    <button class="col" data-color="rosa" data-i18n-title="index.rosa" data-i18n-aria="index.rosa" style="background:#ff6fb5"></button>
    <button class="col" data-color="azul" data-i18n-title="index.azul" data-i18n-aria="index.azul" style="background:#2f80ff"></button>
    <button class="col" data-color="rojo" data-i18n-title="index.rojo" data-i18n-aria="index.rojo" style="background:#e53935"></button>
    <button class="col" data-color="negro" data-i18n-title="index.negro" data-i18n-aria="index.negro" style="background:#111111"></button>
  </span>
  <span class="sep"></span>
  <span id="grosoresAnotar">
    <span class="etq" data-i18n="index.grosor"></span>
    <button class="btn tb gr" data-g="0" data-i18n="index.fino"></button>
    <button class="btn tb gr" data-g="1" data-i18n="index.medio"></button>
    <button class="btn tb gr" data-g="2" data-i18n="index.grueso"></button>
  </span>
  <button class="btn tb cerrar" id="bCerrarAnotar" data-i18n-title="index.cerrarTit"><span class="ic" data-ic="cerrar"></span> <span data-i18n="index.cerrar"></span></button>
</div>

<!-- Barra de ocultar información -->
<div id="barraOcultar" class="hidden">
  <span class="etq" data-i18n="index.ocultarEt"></span>
  <span id="ocultarInfo" class="info" data-i18n="index.ocultarNada"></span>
  <button class="btn tb primary" id="bOcultarAplicar" data-i18n-title="index.ocultarAplicarTit"><span class="ic" data-ic="ocultar"></span> <span data-i18n="index.ocultarAplicar"></span></button>
  <button class="btn tb cerrar" id="bOcultarCerrar" data-i18n-title="index.cerrarTit"><span class="ic" data-ic="cerrar"></span> <span data-i18n="index.cerrar"></span></button>
</div>

<!-- Barra de buscar -->
<div id="barraBuscar" class="hidden">
  <input type="text" id="buscarInput" class="campo" data-i18n-placeholder="index.buscaPh" autocomplete="off" spellcheck="false">
  <button class="btn tb" id="bBuscarAnt" data-i18n-title="index.anteriorTit"><span class="ic" data-ic="izquierda"></span> <span data-i18n="index.anterior"></span></button>
  <button class="btn tb" id="bBuscarSig" data-i18n-title="index.siguienteTit"><span data-i18n="index.siguiente"></span> <span class="ic" data-ic="derecha"></span></button>
  <span id="buscarCuenta" class="info">&nbsp;</span>
  <button class="btn tb" id="bBuscarCerrar" data-i18n-title="index.cerrarTit"><span class="ic" data-ic="cerrar"></span> <span data-i18n="index.cerrar"></span></button>
</div>

<div id="aviso" class="hidden"></div>

<div id="area">
  <div id="miniaturas" data-i18n-aria="index.miniaturasAria"></div>
  <div id="visor" class="hidden"><div id="contenedor"><div id="pdfViewer" class="pdfViewer"></div></div>
    <div id="flotante" role="toolbar" data-i18n-aria="index.flotanteAria">
      <span id="paginaTxt" class="info">&nbsp;</span>
      <span class="sep"></span>
      <button class="btn tb" id="bDeshacer" data-i18n-title="index.deshacerTit"><span class="ic" data-ic="deshacer"></span> <span data-i18n="index.deshacer"></span></button>
      <button class="btn tb" id="bRehacer" data-i18n-title="index.rehacerTit"><span class="ic" data-ic="rehacer"></span> <span data-i18n="index.rehacer"></span></button>
      <span class="sep"></span>
      <button class="btn tb" id="bZoomMenos" data-i18n-title="index.alejarTit"><span class="ic" data-ic="menos"></span> <span data-i18n="index.alejar"></span></button>
      <span id="zoomTxt" class="info">100 %</span>
      <button class="btn tb" id="bZoomMas" data-i18n-title="index.acercarTit"><span class="ic" data-ic="mas"></span> <span data-i18n="index.acercar"></span></button>
      <button class="btn tb" id="bAncho" data-i18n-title="index.ajustarTit"><span class="ic" data-ic="ajustar"></span> <span data-i18n="index.ajustar"></span></button>
    </div>
  </div>

  <div id="inicio">
    <div class="inicio-caja">
      <div class="marca">PepePDF</div>
      <div class="inicio-ico"><span class="ic" data-ic="documento" data-tam="56"></span></div>
      <h1 data-i18n="index.abraUnPdf"></h1>
      <button class="btn primary grande" id="bAbrirGrande"><span class="ic" data-ic="abrir"></span> <span data-i18n="index.abrirUnPdf"></span></button>
      <p data-i18n="index.oArrastre"></p>
    </div>
  </div>
  <div id="soltar" class="hidden"><div data-i18n="index.suelte"></div></div>
</div>

<div id="fantasma"></div>
<div id="carga" class="hidden"><div class="rueda"></div><p id="cargaTxt"></p><div id="cargaBarra" class="barra hidden"><div id="cargaBarraRelleno"></div></div><button id="cargaCancelar" class="btn hidden"></button></div>

<!-- Firmar: elegir cómo -->
<div class="modal hidden" id="dlgFirma"><div class="caja">
  <h2 data-i18n="index.comoFirmar"></h2>
  <button class="btn grande opcion hidden" id="fGuardada"><span class="ic" data-ic="ok" data-tam="32"></span> <span data-i18n="index.firmaGuardada"></span><small><img id="fGuardadaImg" data-i18n-alt="index.firmaGuardadaAlt"></small><span class="rec" data-i18n="index.recomendado"></span></button>
  <button class="btn grande opcion" id="fMouse"><span class="ic" data-ic="mouse" data-tam="32"></span> <span data-i18n="index.conMouse"></span><small data-i18n="index.conMouseSub"></small><span class="rec" data-i18n="index.recomendado"></span></button>
  <button class="btn grande opcion" id="fMovil"><span class="ic" data-ic="movil" data-tam="32"></span> <span data-i18n="index.conCelular"></span><small data-i18n="index.conCelularSub"></small></button>
  <div class="pie"><button class="btn grande cancelar" data-cerrar data-i18n="index.cancelar"></button></div>
</div></div>

<!-- Firmar con el mouse -->
<div class="modal hidden" id="dlgMouse"><div class="caja ancha">
  <h2 data-i18n="index.dibujeFirma"></h2>
  <div class="lienzo-caja" id="lienzoCaja"><canvas id="lienzo"></canvas><span class="lienzo-guia" data-i18n="index.firmeAqui"></span></div>
  <div class="fila">
    <span data-i18n="index.color"></span>
    <button class="btn grande color on" data-color="#111111"><i class="punto" style="background:#111111"></i><span data-i18n="index.negroTinta"></span></button>
    <button class="btn grande color" data-color="#1E3A8A"><i class="punto" style="background:#1E3A8A"></i><span data-i18n="index.azulTinta"></span></button>
    <span class="grow"></span>
    <button class="btn grande" id="mBorrar"><span class="ic" data-ic="tachito"></span> <span data-i18n="index.borrar"></span></button>
  </div>
  <p class="nota" data-i18n="index.notaFirma"></p>
  <div class="pie">
    <button class="btn grande cancelar" data-cerrar data-i18n="index.cancelar"></button>
    <button class="btn grande primary" id="mListo" data-i18n="index.listo"></button>
  </div>
</div></div>

<!-- Firmar con el celular -->
<div class="modal hidden" id="dlgMovil"><div class="caja ancha">
  <h2 id="movilTitulo" data-i18n="index.firmarCelular"></h2>
  <div class="movil-cuerpo">
    <div class="qr-caja"><img id="qrImg" data-i18n-alt="index.qrAlt" class="hidden"><div id="qrEspera"></div></div>
    <ol class="pasos">
      <li data-i18n="index.paso1"></li>
      <li data-i18n="index.paso2"></li>
      <li><span id="movilPaso3" data-i18n="index.paso3"></span> <b data-i18n="index.enviar"></b>.</li>
    </ol>
  </div>
  <p class="nota" data-i18n="index.mismaRed"></p>
  <div class="pie"><button class="btn grande cancelar" id="movilCancelarBtn" data-i18n="index.cancelar"></button></div>
</div></div>

<!-- Contraseña -->
<div class="modal hidden" id="dlgPass"><div class="caja">
  <h2 data-i18n="index.pdfConClave"></h2>
  <p id="passMsg"></p>
  <input type="password" id="passInput" class="campo" autocomplete="off" data-i18n-placeholder="index.contrasena">
  <div class="pie">
    <button class="btn grande cancelar" id="passCancelar" data-i18n="index.cancelar"></button>
    <button class="btn grande primary" id="passOk" data-i18n="index.abrirOk"></button>
  </div>
</div></div>

<!-- Guardar -->
<div class="modal hidden" id="dlgGuardar"><div class="caja">
  <h2 data-i18n="index.guardarTitulo"></h2>
  <button class="btn grande opcion primary" id="gEditable"><span class="ic" data-ic="guardar"></span> <span data-i18n="index.guardarTitulo"></span><small data-i18n="index.guardarSub"></small></button>
  <button class="btn grande opcion" id="gFinal"><span class="ic" data-ic="candado"></span> <span data-i18n="index.guardarFinal"></span><small data-i18n="index.guardarFinalSub"></small></button>
  <div class="pie"><button class="btn grande cancelar" data-cerrar data-i18n="index.cancelar"></button></div>
</div></div>

<!-- Confirmar / avisar (los textos los pone confirmar() en util.js) -->
<div class="modal hidden" id="dlgConfirm"><div class="caja">
  <h2 id="confTitulo"></h2>
  <p id="confMsg"></p>
  <label id="confCasillaEt" class="casilla hidden"><input type="checkbox" id="confCasilla"><span id="confCasillaTxt"></span></label>
  <div class="pie">
    <button class="btn grande cancelar" id="confNo"></button>
    <button class="btn grande primary" id="confSi"></button>
  </div>
</div></div>

<!-- Herramientas -->
<div class="modal hidden" id="dlgHerramientas"><div class="caja extra">
  <h2 data-i18n="index.herramientasTitulo"></h2>
  <div id="herrGrupos"></div>
  <div class="pie"><button class="btn grande cancelar" data-cerrar data-i18n="index.cerrar"></button></div>
</div></div>

<!-- Elegir una opción -->
<div class="modal hidden" id="dlgElegir"><div class="caja">
  <h2 id="elegirTitulo"></h2>
  <div id="elegirLista" class="lista-opciones"></div>
  <div class="pie"><button class="btn grande cancelar" id="elegirCancelar" data-i18n="index.cancelar"></button></div>
</div></div>

<!-- Pedir un texto, número o contraseña -->
<div class="modal hidden" id="dlgTexto"><div class="caja">
  <h2 id="textoTitulo"></h2>
  <label for="textoInput" id="textoEtiqueta"></label>
  <input type="text" id="textoInput" class="campo" autocomplete="off">
  <p id="textoError" class="error-txt hidden"></p>
  <div class="pie">
    <button class="btn grande cancelar" id="textoCancelar" data-i18n="index.cancelar"></button>
    <button class="btn grande primary" id="textoOk"></button>
  </div>
</div></div>

<!-- Formulario con vista previa (marca de agua, números de página) -->
<div class="modal hidden" id="dlgForm"><div class="caja ancha">
  <h2 id="formTitulo"></h2>
  <div class="form-cuerpo">
    <div id="formCampos"></div>
    <div class="form-vista"><canvas id="formVista" width="220" height="285"></canvas><small data-i18n="index.vistaPrevia"></small></div>
  </div>
  <p id="formError" class="error-txt hidden"></p>
  <div class="pie">
    <button class="btn grande cancelar" id="formCancelar" data-i18n="index.cancelar"></button>
    <button class="btn grande primary" id="formOk" data-i18n="index.aplicar"></button>
  </div>
</div></div>

<div class="toast" id="toast"></div>
<input type="file" id="archivo" accept=".pdf,application/pdf" class="hidden">

<script src="lib/pdf-lib.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
