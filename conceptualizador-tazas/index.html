<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyMugs — en desarrollo</title>
<meta name="theme-color" content="#0c0d10">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  :root { --bg: #0c0d10; --panel: #17181c; --text: #f3f3f3; --muted: #a3a6ae; --line: #2e3037; --brand: #f5c400; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  .box { max-width: 460px; text-align: center; background: var(--panel); border: 1.5px dashed var(--brand); border-radius: 16px; padding: 36px 28px; }
  .dot { width: 64px; height: 64px; border-radius: 50%; background: var(--brand); margin: 0 auto 18px; display: grid; place-items: center; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  h1 span { color: var(--brand); }
  p { color: var(--muted); line-height: 1.5; margin: 0 0 22px; }
  a { display: inline-block; background: var(--brand); color: #111; font-weight: 700; text-decoration: none; padding: 10px 16px; border-radius: 9px; }
</style>
</head>
<body>
  <div class="box">
    <div class="dot"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="#111"/></svg></div>
    <h1>MyMugs <span>en desarrollo</span></h1>
    <p>Compón el diseño de tu cliente y míralo sobre la taza en 3D antes de sublimar. Estamos construyendo esta herramienta; pronto estará disponible.</p>
    <a href="../">‹ Volver a 5dollartools</a>
  </div>
</body>
</html>
