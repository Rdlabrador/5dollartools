<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5dollartools</title>
<meta name="description" content="Herramientas fáciles y baratas.">
<style>
  :root {
    --bg: #f3f1ec; --panel: #ffffff; --text: #1f1d1a; --muted: #6b665d;
    --line: #e2ddd3; --accent: #b4441a; --accent-soft: #fbe9df;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1a18; --panel: #252321; --text: #f1eee8; --muted: #a9a398; --line: #3a3733; --accent: #e0703f; --accent-soft: #3a2a22; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 880px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 32px; margin: 0 0 6px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .lead { color: var(--muted); margin: 0 0 32px; font-size: 17px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
  .card { display: flex; gap: 14px; align-items: flex-start; padding: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card img { width: 56px; height: 56px; border-radius: 12px; flex-shrink: 0; }
  .card h2 { font-size: 17px; margin: 2px 0 4px; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
  .soon { border-style: dashed; color: var(--muted); align-items: center; justify-content: center; min-height: 92px; font-size: 14px; }
  .soon:hover { transform: none; border-color: var(--line); }
</style>
</head>
<body>
<main>
  <h1>5dollar<span>tools</span></h1>
  <p class="lead">Herramientas fáciles y baratas para tu negocio.</p>
  <div class="grid">
    <a class="card" href="conceptualizador-bolsas/">
      <img src="conceptualizador-bolsas/icons/icon-192.png" alt="">
      <div>
        <h2>Conceptualizador de bolsas</h2>
        <p>Muestra a tu cliente su logo impreso en la bolsa y exporta el archivo para serigrafía.</p>
      </div>
    </a>
    <div class="card soon">Próximamente más herramientas</div>
  </div>
</main>
</body>
</html>
